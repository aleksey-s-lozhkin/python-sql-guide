<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="t1 d1">
  <title id="t1">list хранит ссылки на отдельные объекты, ndarray — один непрерывный буфер с формой и типом</title>
  <desc id="d1">Слева список из четырёх указателей на отдельные int-объекты. Справа массив: заголовок shape/dtype/strides и непрерывные 8-байтовые ячейки.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f73"/>
    </marker>
    <style>
      .h { font: 700 14.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
      .s { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a7f73; }
      .m { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .n { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a4458; }
      .addr { font: 500 10.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #7a7285; }
    </style>
  </defs>

  <!-- list -->
  <text class="h" x="30" y="40">list</text>
  <text class="s" x="78" y="40">массив ссылок на отдельные объекты</text>

  <rect x="55" y="76" width="74" height="46" rx="8" fill="#fff" stroke="#d8d1c6"/>
  <text class="addr" x="67" y="104">0x…a0</text>
  <rect x="145" y="76" width="74" height="46" rx="8" fill="#fff" stroke="#d8d1c6"/>
  <text class="addr" x="157" y="104">0x…b8</text>
  <rect x="235" y="76" width="74" height="46" rx="8" fill="#fff" stroke="#d8d1c6"/>
  <text class="addr" x="247" y="104">0x…d0</text>
  <rect x="325" y="76" width="74" height="46" rx="8" fill="#fff" stroke="#d8d1c6"/>
  <text class="addr" x="337" y="104">0x…e8</text>

  <path d="M92,124 L92,168" stroke="#8a7f73" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M182,124 L182,168" stroke="#8a7f73" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M272,124 L272,168" stroke="#8a7f73" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M362,124 L362,168" stroke="#8a7f73" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="58" y="174" width="68" height="44" rx="8" fill="#eef4fb" stroke="#b9cfe6"/>
  <text class="m" x="86" y="201">22</text>
  <rect x="148" y="174" width="68" height="44" rx="8" fill="#eef4fb" stroke="#b9cfe6"/>
  <text class="m" x="176" y="201">31</text>
  <rect x="238" y="174" width="68" height="44" rx="8" fill="#eef4fb" stroke="#b9cfe6"/>
  <text class="m" x="266" y="201">25</text>
  <rect x="328" y="174" width="68" height="44" rx="8" fill="#eef4fb" stroke="#b9cfe6"/>
  <text class="m" x="356" y="201">40</text>

  <text class="n" x="55" y="248">каждый int — отдельный объект в памяти (≈28 байт)</text>
  <text class="n" x="55" y="270">плюс 8 байт указателя на него</text>

  <line x1="480" y1="40" x2="480" y2="290" stroke="#e6dfd3" stroke-dasharray="4 5"/>

  <!-- ndarray -->
  <text class="h" x="520" y="40">ndarray</text>
  <text class="s" x="592" y="40">метаданные + непрерывный буфер</text>

  <rect x="520" y="70" width="410" height="38" rx="9" fill="#f4f1ea" stroke="#e0d9cd"/>
  <text class="m" x="536" y="94">shape (4,)  ·  dtype int64  ·  strides (8,)</text>

  <rect x="520" y="140" width="100" height="64" rx="0" fill="#fdf0e6" stroke="#e8b48c"/>
  <text class="m" x="556" y="179">22</text>
  <rect x="620" y="140" width="100" height="64" rx="0" fill="#fdf0e6" stroke="#e8b48c"/>
  <text class="m" x="656" y="179">31</text>
  <rect x="720" y="140" width="100" height="64" rx="0" fill="#fdf0e6" stroke="#e8b48c"/>
  <text class="m" x="756" y="179">25</text>
  <rect x="820" y="140" width="100" height="64" rx="0" fill="#fdf0e6" stroke="#e8b48c"/>
  <text class="m" x="856" y="179">40</text>

  <path d="M525,204 L525,230 L930,230 L930,204" fill="none" stroke="#8a7f73" stroke-width="1.4"/>
  <text class="n" x="650" y="250">4 × 8 байт = 32 байта подряд</text>
  <text class="n" x="520" y="282">одна форма и один тип на весь массив</text>

  <!-- нижняя полоса -->
  <rect x="30" y="330" width="920" height="96" rx="12" fill="#f4f1ea" stroke="#e0d9cd"/>
  <text class="s" x="50" y="360">Отсюда всё остальное:</text>
  <text class="n" x="50" y="386">• int в списке может быть любым объектом, в массиве — только int64 (или другой один тип);</text>
  <text class="n" x="50" y="408">• данные лежат подряд, поэтому цикл по ним можно выполнять на C — это и есть векторизация.</text>
</svg>
