<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="t1 d1">
  <title id="t1">axis=0 схлопывает строки и даёт сумму по столбцам, axis=1 схлопывает столбцы и даёт сумму по строкам</title>
  <desc id="d1">Матрица 3×4: при axis=0 результат — 4 числа по столбцам, при axis=1 — 3 числа по строкам.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .h { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
      .s { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a4458; }
      .n { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7a7285; }
      .v { font: 600 15px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .r { font: 700 15px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .lbl { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a7f73; letter-spacing: .12em; }
    </style>
  </defs>

  <!-- ── left: axis=0 ── -->
  <text class="h" x="40" y="32">axis=0</text>
  <text class="s" x="108" y="32">схлопываем строки → результат по столбцам</text>

  <g stroke="#d8d1c6">
    <rect x="40" y="60" width="56" height="40" fill="#fff"/><rect x="96" y="60" width="56" height="40" fill="#fff"/>
    <rect x="152" y="60" width="56" height="40" fill="#fff"/><rect x="208" y="60" width="56" height="40" fill="#fff"/>
    <rect x="40" y="100" width="56" height="40" fill="#fff"/><rect x="96" y="100" width="56" height="40" fill="#fff"/>
    <rect x="152" y="100" width="56" height="40" fill="#fff"/><rect x="208" y="100" width="56" height="40" fill="#fff"/>
    <rect x="40" y="140" width="56" height="40" fill="#fff"/><rect x="96" y="140" width="56" height="40" fill="#fff"/>
    <rect x="152" y="140" width="56" height="40" fill="#fff"/><rect x="208" y="140" width="56" height="40" fill="#fff"/>
  </g>
  <g class="v" text-anchor="middle">
    <text x="68" y="85">0</text><text x="124" y="85">1</text><text x="180" y="85">2</text><text x="236" y="85">3</text>
    <text x="68" y="125">4</text><text x="124" y="125">5</text><text x="180" y="125">6</text><text x="236" y="125">7</text>
    <text x="68" y="165">8</text><text x="124" y="165">9</text><text x="180" y="165">10</text><text x="236" y="165">11</text>
  </g>

  <path d="M152,192 L152,232" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/>
  <text class="lbl" x="164" y="216">ВНИЗ</text>

  <g stroke="#e8b48c">
    <rect x="40" y="240" width="56" height="40" fill="#fdf0e6"/><rect x="96" y="240" width="56" height="40" fill="#fdf0e6"/>
    <rect x="152" y="240" width="56" height="40" fill="#fdf0e6"/><rect x="208" y="240" width="56" height="40" fill="#fdf0e6"/>
  </g>
  <g class="r" text-anchor="middle">
    <text x="68" y="265">12</text><text x="124" y="265">15</text><text x="180" y="265">18</text><text x="236" y="265">21</text>
  </g>
  <text class="n" x="40" y="302">результат: shape (4,) — одно число на столбец</text>

  <!-- ── right: axis=1 ── -->
  <text class="h" x="500" y="32">axis=1</text>
  <text class="s" x="568" y="32">схлопываем столбцы → результат по строкам</text>

  <g stroke="#d8d1c6">
    <rect x="500" y="60" width="56" height="40" fill="#fff"/><rect x="556" y="60" width="56" height="40" fill="#fff"/>
    <rect x="612" y="60" width="56" height="40" fill="#fff"/><rect x="668" y="60" width="56" height="40" fill="#fff"/>
    <rect x="500" y="100" width="56" height="40" fill="#fff"/><rect x="556" y="100" width="56" height="40" fill="#fff"/>
    <rect x="612" y="100" width="56" height="40" fill="#fff"/><rect x="668" y="100" width="56" height="40" fill="#fff"/>
    <rect x="500" y="140" width="56" height="40" fill="#fff"/><rect x="556" y="140" width="56" height="40" fill="#fff"/>
    <rect x="612" y="140" width="56" height="40" fill="#fff"/><rect x="668" y="140" width="56" height="40" fill="#fff"/>
  </g>
  <g class="v" text-anchor="middle">
    <text x="528" y="85">0</text><text x="584" y="85">1</text><text x="640" y="85">2</text><text x="696" y="85">3</text>
    <text x="528" y="125">4</text><text x="584" y="125">5</text><text x="640" y="125">6</text><text x="696" y="125">7</text>
    <text x="528" y="165">8</text><text x="584" y="165">9</text><text x="640" y="165">10</text><text x="696" y="165">11</text>
  </g>

  <path d="M736,120 L776,120" fill="none" stroke="#2f6b4f" stroke-width="2" marker-end="url(#ar)"/>
  <text class="lbl" x="740" y="106">ВПРАВО</text>

  <g stroke="#9cc0a8">
    <rect x="790" y="60" width="70" height="40" fill="#e9f2ec"/>
    <rect x="790" y="100" width="70" height="40" fill="#e9f2ec"/>
    <rect x="790" y="140" width="70" height="40" fill="#e9f2ec"/>
  </g>
  <g class="r" text-anchor="middle">
    <text x="825" y="85">6</text><text x="825" y="125">22</text><text x="825" y="165">38</text>
  </g>
  <text class="n" x="700" y="202">shape (3,) — по строке</text>

  <!-- подпись осей на матрицах -->
  <text class="n" x="40" y="330">ось 0 идёт по строкам (вниз)</text>
  <text class="n" x="500" y="330">ось 1 идёт по столбцам (вправо)</text>

  <rect x="40" y="360" width="900" height="64" rx="12" fill="#f4f1ea" stroke="#e0d9cd"/>
  <text class="s" x="60" y="386">Ось — направление свёртки, и она исчезает из результата.</text>
  <text class="s" x="60" y="408">keepdims=True оставляет её размером 1 — это пригодится для broadcasting в главе 10.</text>
</svg>
