<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="t2 d2">
  <title id="t2">Три инструмента: Counter считает, defaultdict группирует, deque держит оба конца</title>
  <desc id="d2">Counter — таблица частот, defaultdict — группы по ключу, deque — очередь с быстрыми операциями слева и справа.</desc>
  <defs>
    <marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f73"/>
    </marker>
    <style>
      .h { font: 700 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
      .k { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a4458; }
      .m { font: 600 12.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .s { font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7a7285; }
      .lbl { font: 700 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a7f73; letter-spacing: .12em; }
    </style>
  </defs>

  <!-- Counter -->
  <rect x="25" y="64" width="300" height="292" rx="14" fill="#fff" stroke="#e6dfd3"/>
  <text class="lbl" x="45" y="90">СЧИТАЕТ</text>
  <text class="h" x="45" y="116">Counter</text>
  <text class="k" x="45" y="140">сколько раз встретилось</text>

  <text class="m" x="45" y="176">sql</text>
  <rect x="120" y="165" width="150" height="15" rx="4" fill="#e8b48c"/>
  <text class="m" x="278" y="177">3</text>

  <text class="m" x="45" y="206">python</text>
  <rect x="120" y="195" width="100" height="15" rx="4" fill="#e8b48c"/>
  <text class="m" x="228" y="207">2</text>

  <text class="m" x="45" y="236">pandas</text>
  <rect x="120" y="225" width="50" height="15" rx="4" fill="#e8b48c"/>
  <text class="m" x="178" y="237">1</text>

  <text class="s" x="45" y="286">most_common(2)</text>
  <text class="s" x="45" y="308">→ [('sql', 3), ('python', 2)]</text>
  <text class="s" x="45" y="334">Counter — это dict частот</text>

  <!-- defaultdict -->
  <rect x="340" y="64" width="300" height="292" rx="14" fill="#fff" stroke="#e6dfd3"/>
  <text class="lbl" x="360" y="90">ГРУППИРУЕТ</text>
  <text class="h" x="360" y="116">defaultdict(list)</text>
  <text class="k" x="360" y="140">ключ → список значений</text>

  <rect x="360" y="158" width="120" height="30" rx="8" fill="#e9f2ec" stroke="#9cc0a8"/>
  <text class="m" x="372" y="178">Anna</text>
  <path d="M484,173 L508,173" fill="none" stroke="#8a7f73" stroke-width="1.5" marker-end="url(#q1)"/>
  <text class="m" x="516" y="178">[1200, 500]</text>

  <rect x="360" y="200" width="120" height="30" rx="8" fill="#e9f2ec" stroke="#9cc0a8"/>
  <text class="m" x="372" y="220">Ivan</text>
  <path d="M484,215 L508,215" fill="none" stroke="#8a7f73" stroke-width="1.5" marker-end="url(#q1)"/>
  <text class="m" x="516" y="220">[800]</text>

  <text class="s" x="360" y="270">by_user[key].append(x)</text>
  <text class="s" x="360" y="292">без «есть ли ключ»</text>
  <text class="s" x="360" y="318">чтение создаёт запись</text>

  <!-- deque -->
  <rect x="655" y="64" width="300" height="292" rx="14" fill="#fff" stroke="#e6dfd3"/>
  <text class="lbl" x="675" y="90">ДЕРЖИТ ОБА КОНЦА</text>
  <text class="h" x="675" y="116">deque</text>
  <text class="k" x="675" y="140">очередь с быстрым левым краем</text>

  <rect x="715" y="170" width="46" height="40" rx="8" fill="#fbf3dd" stroke="#e3c98a"/>
  <text class="m" x="731" y="196">1</text>
  <rect x="769" y="170" width="46" height="40" rx="8" fill="#fbf3dd" stroke="#e3c98a"/>
  <text class="m" x="785" y="196">2</text>
  <rect x="823" y="170" width="46" height="40" rx="8" fill="#fbf3dd" stroke="#e3c98a"/>
  <text class="m" x="839" y="196">3</text>
  <rect x="877" y="170" width="46" height="40" rx="8" fill="#fff" stroke="#e3c98a" stroke-dasharray="5 4"/>
  <text class="m" x="893" y="196">4</text>

  <path d="M686,190 L700,190" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#q1)"/>
  <path d="M928,190 L942,190" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#q1)"/>
  <text class="s" x="676" y="160">appendleft</text>
  <text class="s" x="948" y="160" text-anchor="end">append</text>
  <text class="s" x="676" y="236">popleft</text>
  <text class="s" x="948" y="236" text-anchor="end">pop</text>

  <text class="s" x="675" y="286">оба конца O(1)</text>
  <text class="s" x="675" y="308">maxlen — скользящее окно</text>
  <text class="s" x="675" y="334">list.insert(0) — O(n)</text>

  <rect x="25" y="376" width="930" height="2" fill="#e6dfd3"/>
  <text class="s" x="25" y="406">Все три — надстройки над dict и list: готовые операции там, где обычно пишут пять строк руками.</text>
</svg>
