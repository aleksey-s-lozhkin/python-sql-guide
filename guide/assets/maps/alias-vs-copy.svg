<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" role="img" aria-labelledby="t2 d2">
  <title id="t2">Присваивание — второе имя объекта, срез — копия; tuple можно делить без копии</title>
  <desc id="d2">Три случая: b = a ссылается на тот же список, c = a[:] создаёт копию, tuple можно передавать без копии.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f73"/>
    </marker>
    <style>
      .lbl { font: 700 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a7f73; letter-spacing: .14em; }
      .code { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .tag { font: 700 17px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .val { font: 600 19px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .b { font: 700 14.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
      .s { font: 400 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a4458; }
      .n { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7a7285; }
    </style>
  </defs>

  <!-- ── 1. b = a ── -->
  <text class="lbl" x="40" y="34">B = A: ВТОРОЕ ИМЯ</text>
  <text class="code" x="420" y="34">b = a</text>

  <rect x="40" y="72" width="46" height="34" rx="9" fill="#fff" stroke="#d8d1c6"/>
  <text class="tag" x="56" y="95">a</text>
  <rect x="40" y="132" width="46" height="34" rx="9" fill="#fff" stroke="#d8d1c6"/>
  <text class="tag" x="56" y="155">b</text>

  <path d="M88,89 C150,89 180,110 276,122" fill="none" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>
  <path d="M88,149 C150,149 190,140 276,140" fill="none" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="280" y="72" width="320" height="108" rx="14" fill="#fff" stroke="#d8d1c6"/>
  <text class="n" x="300" y="96">один объект списка</text>
  <text class="val" x="300" y="148">[ 10, 20, 30 ]</text>

  <text class="b" x="640" y="100">b.append(4)</text>
  <text class="s" x="640" y="122">изменение видно через a</text>
  <text class="n" x="640" y="146">одна коллекция, два имени</text>

  <line x1="40" y1="212" x2="940" y2="212" stroke="#e6dfd3" stroke-dasharray="4 5"/>

  <!-- ── 2. c = a[:] ── -->
  <text class="lbl" x="40" y="246">C = A[:]: НОВЫЙ СОСТАВ</text>
  <text class="code" x="420" y="246">c = a[:]</text>

  <rect x="40" y="284" width="46" height="34" rx="9" fill="#fff" stroke="#d8d1c6"/>
  <text class="tag" x="56" y="307">c</text>
  <path d="M88,301 C150,301 190,306 276,312" fill="none" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="280" y="272" width="320" height="108" rx="14" fill="#e9f2ec" stroke="#9cc0a8"/>
  <text class="n" x="300" y="296">копия: другой объект</text>
  <text class="val" x="300" y="348">[ 10, 20, 30 ]</text>

  <text class="b" x="640" y="300">c.append(4)</text>
  <text class="s" x="640" y="322">a не меняется</text>
  <text class="n" x="640" y="346">две коллекции, но вложенные</text>
  <text class="n" x="640" y="364">объекты всё ещё общие</text>

  <line x1="40" y1="412" x2="940" y2="412" stroke="#e6dfd3" stroke-dasharray="4 5"/>

  <!-- ── 3. tuple ── -->
  <text class="lbl" x="40" y="446">TUPLE: ДЕЛИТЬ БЕЗ КОПИИ БЕЗОПАСНО</text>
  <text class="code" x="420" y="446">t1 = t2 = (10, 20, 30)</text>

  <rect x="40" y="474" width="46" height="32" rx="9" fill="#fff" stroke="#d8d1c6"/>
  <text class="tag" x="54" y="496">t1</text>
  <rect x="40" y="520" width="46" height="32" rx="9" fill="#fff" stroke="#d8d1c6"/>
  <text class="tag" x="54" y="542">t2</text>

  <path d="M88,490 C150,490 180,500 276,506" fill="none" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>
  <path d="M88,536 C150,536 190,522 276,516" fill="none" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="280" y="464" width="320" height="92" rx="14" fill="#f3eefb" stroke="#c9b8e0"/>
  <text class="n" x="300" y="488">неизменяемый объект</text>
  <text class="val" x="300" y="530">( 10, 20, 30 )</text>
  <path d="M560,495 v-4 a7,7 0 0 1 14,0 v4" fill="none" stroke="#6d4c8f" stroke-width="2"/>
  <rect x="557" y="495" width="18" height="13" rx="2.5" fill="#fff" stroke="#6d4c8f" stroke-width="2"/>

  <text class="b" x="640" y="492">менять нельзя</text>
  <text class="s" x="640" y="514">значит, копия не нужна</text>
  <text class="n" x="640" y="536">можно смело передавать</text>

  <!-- нижняя полоса -->
  <rect x="40" y="576" width="900" height="38" rx="10" fill="#f4f1ea" stroke="#e0d9cd"/>
  <text class="s" x="60" y="600">Срез списка — копия. Срез массива NumPy — окно в те же данные (глава 11). Это разные вещи.</text>
</svg>
