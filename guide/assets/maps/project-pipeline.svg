<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="t2 d2">
  <title id="t2">Путь проекта: вопросы к данным, SQL-шаги, проверка чисел, отчёт</title>
  <desc id="d2">Пять этапов проекта: вопросы, схема и данные, SQL по шагам, проверка, вывод и отчёт.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f73"/>
    </marker>
    <style>
      .h { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
      .lbl { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a7f73; letter-spacing: .1em; }
      .s { font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a4458; }
      .n { font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7a7285; }
      .v { font: 500 11px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .num { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #c2410c; }
    </style>
  </defs>

  <text class="lbl" x="24" y="34">ЭТАПЫ</text>

  <!-- step 1 -->
  <rect x="24" y="52" width="170" height="120" rx="10" fill="#fff" stroke="#d8d1c6"/>
  <text class="num" x="40" y="76">1</text>
  <text class="h" x="60" y="76">Вопросы</text>
  <text class="s" x="40" y="100">Что хотим узнать?</text>
  <text class="n" x="40" y="120">выручка по месяцам,</text>
  <text class="n" x="40" y="138">топ пользователей,</text>
  <text class="n" x="40" y="156">доля категорий</text>

  <path d="M200,112 L224,112" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- step 2 -->
  <rect x="228" y="52" width="170" height="120" rx="10" fill="#fff" stroke="#d8d1c6"/>
  <text class="num" x="244" y="76">2</text>
  <text class="h" x="264" y="76">Данные</text>
  <text class="s" x="244" y="100">Какие таблицы?</text>
  <text class="n" x="244" y="120">orders · users</text>
  <text class="n" x="244" y="138">products</text>
  <text class="n" x="244" y="156">ключи и связи</text>

  <path d="M404,112 L428,112" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- step 3 -->
  <rect x="432" y="52" width="220" height="120" rx="10" fill="#fdf0e6" stroke="#e8b48c"/>
  <text class="num" x="448" y="76">3</text>
  <text class="h" x="468" y="76">SQL по шагам</text>
  <text class="v" x="448" y="100">CTE + aggregate</text>
  <text class="v" x="448" y="120">+ window + order</text>
  <text class="n" x="448" y="144">один запрос —</text>
  <text class="n" x="448" y="160">один вопрос</text>

  <path d="M658,112 L682,112" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- step 4 -->
  <rect x="686" y="52" width="130" height="120" rx="10" fill="#fff" stroke="#e0b8b8"/>
  <text class="num" x="702" y="76">4</text>
  <text class="h" x="722" y="76">Проверка</text>
  <text class="n" x="702" y="102">суммы</text>
  <text class="n" x="702" y="122">число строк</text>
  <text class="n" x="702" y="142">NULL</text>
  <text class="r" x="702" y="162" style="font-size:11px">не совпало → назад</text>

  <path d="M822,112 L846,112" stroke="#8a7f73" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- step 5 -->
  <rect x="850" y="52" width="106" height="120" rx="10" fill="#e9f2ec" stroke="#9cc0a8"/>
  <text class="num" x="866" y="76">5</text>
  <text class="h" x="886" y="76">Отчёт</text>
  <text class="n" x="866" y="102">таблица</text>
  <text class="n" x="866" y="122">график</text>
  <text class="n" x="866" y="142">вывод</text>

  <!-- verification loop -->
  <path d="M750,178 C750,220 470,220 470,182" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text class="n" x="530" y="216">проверка до отчёта</text>

  <!-- checks -->
  <rect x="24" y="248" width="932" height="98" rx="10" fill="#f4f1ea" stroke="#e0d9cd"/>
  <text class="s" x="44" y="274">Что проверять в проекте:</text>
  <text class="n" x="44" y="298">• общая сумма из детального запроса = сумма по группам; • COUNT(*) = сумма COUNT по группам;</text>
  <text class="n" x="44" y="320">• строки без пары (LEFT JOIN + IS NULL) объяснены; • NULL не превращены в нули молча;</text>
  <text class="n" x="44" y="340">• EXPLAIN показывает отсутствие неожиданных Seq Scan на больших таблицах.</text>

  <rect x="24" y="368" width="932" height="82" rx="10" fill="#fff" stroke="#d8d1c6"/>
  <text class="s" x="44" y="394">Результат проекта — воспроизводимый скрипт: схема, данные, запросы, проверки.</text>
  <text class="n" x="44" y="418">Не «я посчитал в блокноте», а «вот файл, который можно запустить и получить те же числа».</text>
  <text class="n" x="44" y="440">В этом и смысл частей I–IV: Python, pandas и SQL — один конвейер от данных до ответа.</text>
</svg>
