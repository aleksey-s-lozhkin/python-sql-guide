<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="t1 d1">
  <title id="t1">DataFrame: индекс, колонки и значения; колонка — это Series с тем же индексом</title>
  <desc id="d1">Таблица с индексом anna/ivan/olga и колонками amount, city, user; выделенная колонка amount вынесена как Series.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .h { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
      .lbl { font: 700 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a7f73; letter-spacing: .12em; }
      .v { font: 500 14px ui-monospace, "SF Mono", Menlo, monospace; fill: #1d1b26; }
      .s { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a4458; }
      .n { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7a7285; }
      .c { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #c2410c; }
    </style>
  </defs>

  <text class="lbl" x="60" y="40">DATAFRAME</text>

  <!-- header -->
  <rect x="60" y="56" width="90" height="44" fill="#f4f1ea" stroke="#d8d1c6"/>
  <text class="n" x="76" y="84">index</text>
  <rect x="150" y="56" width="120" height="44" fill="#fdf0e6" stroke="#e8b48c"/>
  <text class="h" x="176" y="84">amount</text>
  <rect x="270" y="56" width="140" height="44" fill="#f4f1ea" stroke="#d8d1c6"/>
  <text class="h" x="296" y="84">city</text>
  <rect x="410" y="56" width="110" height="44" fill="#f4f1ea" stroke="#d8d1c6"/>
  <text class="h" x="434" y="84">user</text>

  <!-- rows -->
  <g stroke="#d8d1c6">
    <rect x="60" y="100" width="90" height="46" fill="#faf8f4"/><rect x="150" y="100" width="120" height="46" fill="#fdf0e6"/><rect x="270" y="100" width="140" height="46" fill="#fff"/><rect x="410" y="100" width="110" height="46" fill="#fff"/>
    <rect x="60" y="146" width="90" height="46" fill="#faf8f4"/><rect x="150" y="146" width="120" height="46" fill="#fdf0e6"/><rect x="270" y="146" width="140" height="46" fill="#fff"/><rect x="410" y="146" width="110" height="46" fill="#fff"/>
    <rect x="60" y="192" width="90" height="46" fill="#faf8f4"/><rect x="150" y="192" width="120" height="46" fill="#fdf0e6"/><rect x="270" y="192" width="140" height="46" fill="#fff"/><rect x="410" y="192" width="110" height="46" fill="#fff"/>
  </g>
  <g class="v">
    <text x="84" y="128">anna</text><text x="176" y="128">1200</text><text x="294" y="128">Москва</text><text x="432" y="128">anna</text>
    <text x="84" y="174">ivan</text><text x="176" y="174">800</text><text x="294" y="174">Казань</text><text x="432" y="174">ivan</text>
    <text x="84" y="220">olga</text><text x="176" y="220">500</text><text x="294" y="220">Москва</text><text x="432" y="220">olga</text>
  </g>

  <text class="n" x="60" y="262">shape (3, 3) · index = метки строк · columns = имена колонок</text>
  <text class="n" x="60" y="284">у каждой колонки свой dtype: amount int64, city str, user str</text>

  <!-- arrow to Series -->
  <path d="M534,178 C566,178 584,150 612,150" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/>
  <text class="c" x="540" y="132">df["amount"]</text>

  <!-- Series -->
  <text class="lbl" x="628" y="40">SERIES</text>
  <rect x="628" y="56" width="80" height="44" fill="#f4f1ea" stroke="#d8d1c6"/>
  <text class="n" x="642" y="84">index</text>
  <rect x="708" y="56" width="212" height="44" fill="#fdf0e6" stroke="#e8b48c"/>
  <text class="h" x="736" y="84">amount</text>

  <g stroke="#d8d1c6">
    <rect x="628" y="100" width="80" height="46" fill="#faf8f4"/><rect x="708" y="100" width="212" height="46" fill="#fdf0e6"/>
    <rect x="628" y="146" width="80" height="46" fill="#faf8f4"/><rect x="708" y="146" width="212" height="46" fill="#fdf0e6"/>
    <rect x="628" y="192" width="80" height="46" fill="#faf8f4"/><rect x="708" y="192" width="212" height="46" fill="#fdf0e6"/>
  </g>
  <g class="v">
    <text x="644" y="128">anna</text><text x="736" y="128">1200</text>
    <text x="644" y="174">ivan</text><text x="736" y="174">800</text>
    <text x="644" y="220">olga</text><text x="736" y="220">500</text>
  </g>
  <text class="n" x="628" y="262">index + values + name="amount"</text>
  <text class="n" x="628" y="284">отдельная колонка — это Series</text>

  <rect x="60" y="316" width="860" height="58" rx="12" fill="#f4f1ea" stroke="#e0d9cd"/>
  <text class="s" x="80" y="340">DataFrame — это набор Series с общим индексом. Поэтому колонку можно достать и работать с ней как с вектором.</text>
  <text class="s" x="80" y="362">А индекс — не «номер строки»: после сортировки он остаётся прежним и перестаёт совпадать с позицией.</text>
</svg>
