name: Книга на GitHub Pages

# Публикуем не через artifact/deploy-pages, а через ветку gh-pages:
# так публикация не зависит от целостности артефактов Actions и всегда воспроизводима
# локально тем же скриптом tools/publish.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Опубликовать guide/ в ветку gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git worktree add --detach /tmp/site
          cd /tmp/site
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true

          cp -R "$GITHUB_WORKSPACE/guide/." .
          touch .nojekyll

          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push --force origin gh-pages
